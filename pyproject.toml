[tool.poetry]
name = "aws-dlv"
version = "1.0.0"
description = "AWS Delivery"
authors = [
    "ederray <eder.ray@gmail.com>"  # <-- CORREÇÃO: Formato String
]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11"
# --- SUAS DEPENDÊNCIAS EXISTENTES MOVIDAS ---
# RECOMENDAÇÃO: Use o formato simples (sem o "==") para deixar o Poetry resolver:
asttokens = "3.0.0"
colorama = "0.4.6"
comm = "0.2.3"
debugpy = "1.8.16"
tornado = "6.5.2"
traitlets = "5.14.3"
tzdata = "2025.2"
wcwidth = "0.2.13"

# NOVAS DEPENDÊNCIAS QUE VOCÊ PRECISA INSTALAR
mlflow = "^2.12.2"  # Usando uma versão recente compatível com Python 3.11

# --- DEPENDÊNCIAS DE ANÁLISE/ML COM RANGES ---
matplotlib = ">=3.10.6,<4.0.0"
seaborn = ">=0.13.2,<0.14.0"
plotly = ">=6.3.0,<7.0.0"
simpy = "^4.1.1"
holidays = "^0.81"
shap = "^0.48.0"
graphviz = "^0.21"
lightgbm = "^4.6.0"
catboost = "^1.2.8"
ipywidgets = "^8.1.7"
missingno = "^0.5.2"
sidetable = "^0.9.1"
statsmodels = "^0.14.5"
scipy = "^1.16.2"
dagshub = "^0.6.3"
dotenv = "^0.9.9"
geopy = "^2.4.1"
nbformat = "^5.10.4"
pydot = "^4.0.1"
joblib = "^1.5.2"

[tool.poetry.group.dev.dependencies]
# FERRAMENTAS DE DESENVOLVIMENTO
black = "^24.3.0"
isort = "^5.13.2"
flake8 = "^7.0.0"
dotenv = "^0.9.9"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"